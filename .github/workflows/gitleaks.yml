name: Secret Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  permissions:
  contents: read

  jobs:
  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      with:
        fetch-depth: 0

